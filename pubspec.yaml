name: bahi
description: "Inventory management app for rural Indian shopkeepers — voice-first, Hindi-based, offline-capable."
publish_to: 'none'

# version = tag for GitHub Releases: v<major>.<minor>.<patch>
# build number = Android versionCode (increment per release)
version: 0.3.2+3

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # Auth (Supabase Auth / Google OAuth only — all data now goes through
  # the Node/Express backend below, not direct Supabase client calls)
  supabase_flutter: ^2.0.0
  # google_sign_in: ^6.1.6 (temporarily removed; use Supabase OAuth flow instead; gradle issue)

  # Backend API client + live updates
  dio: ^5.7.0
  socket_io_client: ^2.0.3+1

  # State management
  flutter_riverpod: ^2.4.10
  riverpod_annotation: ^2.3.0

  # Local cache (offline support)
  sqflite: ^2.3.0
  path: ^1.8.3
  path_provider: ^2.1.0

  # Voice input/output
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.5

  # Connectivity detection
  connectivity_plus: ^5.0.2

  # UI & icons
  cupertino_icons: ^1.0.6
  google_fonts: ^6.0.0

  # In-app updates
  permission_handler: ^11.3.1
  flutter_downloader: ^1.12.0

  # App info
  package_info_plus: ^8.1.0

  # Share intent
  share_plus: ^10.1.4

  # Devanagari<->Latin romanization for Hinglish/cross-script search matching
  inditrans: ^0.12.1
  # Phonetic (Double Metaphone) matching — handles English spelling quirks
  # (e.g. "fortune" sounds like "forchun") that plain edit-distance misses
  dart_phonetics: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.4.9
  drift_dev: ^2.17.0
  riverpod_generator: ^2.4.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
