name: Deploy Backend to EC2

# Manual trigger only — click "Run workflow" in the GitHub Actions tab.
# No automatic deploy on push, by design: this is a single production
# instance with no staging environment, so deploys should be deliberate.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to deploy"
        required: false
        default: "main"

jobs:
  # Runs first. Deploy only starts if this job passes.
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Throwaway Postgres for this job only. No prod or EC2 secrets are used
    # here, so the destructive `prisma db push --force-reset` below can only
    # ever reach this container.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: bahi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d bahi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://ci:ci@localhost:5432/bahi_test
      DIRECT_URL: postgresql://ci:ci@localhost:5432/bahi_test
      SUPABASE_JWKS_URL: http://localhost/unused
    steps:
      - name: Checkout the branch being deployed
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Build (typecheck and emit)
        run: npm run build

      - name: Apply schema to the CI database
        run: npx prisma db push --force-reset --skip-generate

      - name: Run tests
        run: npx vitest run

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/Bahi/backend

            # .env is written fresh from GitHub Secrets on every deploy —
            # secrets are the source of truth, not whatever's manually
            # sitting on the instance. Quoted heredoc ('EOF') so bash
            # never re-interprets any special characters that happen to
            # be inside the secret values (e.g. a DB password containing
            # a $ or backtick) while writing the file.
            cat > .env << 'EOF'
            DATABASE_URL="${{ secrets.DATABASE_URL }}"
            DIRECT_URL="${{ secrets.DIRECT_URL }}"
            SUPABASE_JWKS_URL="${{ secrets.SUPABASE_JWKS_URL }}"
            PORT="${{ secrets.PORT }}"
            EOF

            # Hard reset instead of checkout+pull — EC2 is a pure deploy
            # target, never somewhere with organic local changes. A prior
            # `npm install` run here left package-lock.json drifted from
            # origin, which blocked a plain `git pull` (fast-forward
            # refused with a dirty working tree). git is the source of
            # truth; discard anything local and match origin exactly.
            git fetch origin
            git checkout ${{ github.event.inputs.branch }}
            git reset --hard origin/${{ github.event.inputs.branch }}
            npm install
            npm run build

            # Applies any new prisma/migrations/*.sql not yet in prod's
            # _prisma_migrations table. No-ops cleanly if there's nothing
            # new (e.g. this exact deploy has no schema change) — safe to
            # run on every deploy, not just ones that touch the schema.
            # Uses DIRECT_URL (session pooler, port 5432): the transaction
            # pooler DATABASE_URL uses (port 6543, pgbouncer=true) hangs
            # the schema-engine's connection handshake — confirmed while
            # setting up this migration history.
            npx prisma migrate deploy

            pm2 restart bahi-backend
            pm2 save
            echo "Deployed $(git rev-parse --short HEAD) successfully"
