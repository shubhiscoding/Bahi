name: Deploy Backend to EC2

# Manual trigger only — click "Run workflow" in the GitHub Actions tab.
# No automatic deploy on push, by design: this is a single production
# instance with no staging environment, so deploys should be deliberate.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to deploy"
        required: false
        default: "main"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/Bahi/backend

            # .env is written fresh from GitHub Secrets on every deploy —
            # secrets are the source of truth, not whatever's manually
            # sitting on the instance. Quoted heredoc ('EOF') so bash
            # never re-interprets any special characters that happen to
            # be inside the secret values (e.g. a DB password containing
            # a $ or backtick) while writing the file.
            cat > .env << 'EOF'
            DATABASE_URL="${{ secrets.DATABASE_URL }}"
            SUPABASE_JWKS_URL="${{ secrets.SUPABASE_JWKS_URL }}"
            PORT="${{ secrets.PORT }}"
            EOF

            git fetch origin
            git checkout ${{ github.event.inputs.branch }}
            git pull origin ${{ github.event.inputs.branch }}
            npm install
            npm run build
            pm2 restart bahi-backend
            pm2 save
            echo "Deployed $(git rev-parse --short HEAD) successfully"
